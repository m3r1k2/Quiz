{% extends "main.html" %}
{% block title %}Редагування профілю{% endblock %}

{% block content %}
<h2>Редагування профілю</h2>

<form method="post" enctype="multipart/form-data" class="card p-4 shadow-sm mt-3">
  {% csrf_token %}
  {{ form.as_p }}

  <div class="d-flex gap-3 mt-3">
    <button type="submit" class="btn btn-main">Зберегти</button>
    <a href="{% url 'accounts:profile' %}" class="btn btn-outline">Назад</a>
  </div>
</form>
{% endblock %}
