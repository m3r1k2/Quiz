{% extends "main.html" %}
{% block title %}Вхід{% endblock %}

{% block content %}
<h2 class="mb-3">Вхід</h2>
<form method="post" class="card p-3 shadow-sm">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-success">Увійти</button>
</form>
<p class="mt-3">Немає акаунта? <a href="{% url 'accounts:register' %}">Зареєструйся</a></p>
{% endblock %}
