<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Онлайн-вікторина{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --grad-main: linear-gradient(135deg, #6366f1, #8b5cf6);
            --grad-btn: linear-gradient(135deg, #6a85ff, #8f6fff);
            --grad-danger: linear-gradient(135deg, #ef4444, #dc2626);
            --bg-soft: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        body {
            min-height: 100vh;
            background: var(--bg-soft);
            font-family: Inter, system-ui, sans-serif;
        }

        /* NAVBAR */
        .navbar {
            background: var(--grad-main);
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
        }

        .navbar-brand {
            font-weight: 700;
        }

        /* CONTENT */
        .content-wrapper {
            max-width: 1200px;
            margin: auto;
        }

        /* BUTTONS */
        .btn-main {
            background: var(--grad-btn);
            color: #fff;
            border-radius: 14px;
            padding: 10px 18px;
            border: none;
            transition: .25s;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,.25);
            color: #fff;
        }

        .btn-danger {
            background: var(--grad-danger);
            border-radius: 14px;
            border: none;
        }

        .btn-danger:hover {
            transform: none;
            box-shadow: none;
        }

        footer {
            background: rgba(255,255,255,.7);
            backdrop-filter: blur(6px);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            Онлайн‑вікторина
        </a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'quiz:list' %}">Вікторини</a>
                </li>
            </ul>

            <div class="d-flex gap-2">
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:profile' %}" class="btn btn-main">
                        Профіль
                    </a>

                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-danger">
                            Вийти
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="btn btn-main">
                        Увійти
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<div class="container content-wrapper mb-5">
    {% block content %}{% endblock %}
</div>

<footer class="text-center py-3 border-top">
    <small class="text-muted">© 2025 Онлайн‑вікторина</small>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- PAGE SCRIPTS -->
{% block scripts %}{% endblock %}

</body>
</html>
