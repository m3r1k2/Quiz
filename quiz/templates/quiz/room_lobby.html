{% extends "main.html" %}
{% load static %}

{% block content %}
<h2>Кімната: {{ object.code }}</h2>

<ul id="players">
  {% for p in players %}
    <li>{{ p.user.username }}</li>
  {% endfor %}
</ul>

{% if request.user == object.host %}
  <button
    id="startBtn"
    type="button"
    class="btn btn-main mt-3"
  >
    ▶ Start
  </button>
{% else %}
  <p class="text-muted">Очікуємо хоста…</p>
{% endif %}
{% endblock %}

{% block scripts %}
<script>
  const ROOM_CODE = "{{ object.code }}";
</script>
<script src="{% static 'quiz/room_lobby.js' %}"></script>
{% endblock %}
