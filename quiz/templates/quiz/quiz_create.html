{% extends "main.html" %}
{% block title %}Створити вікторину{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card card-soft p-4">
            <h3 class="mb-4 text-center">Нова вікторина</h3>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-main w-100 mt-3">
                    Створити
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
