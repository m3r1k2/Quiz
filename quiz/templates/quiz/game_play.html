{% extends "main.html" %}
{% block content %}
<h2>Онлайн-вікторина</h2>

<div id="question-block" style="display:none;">
    <h3 id="question-text"></h3>
    <div id="answers"></div>

    <button class="btn btn-primary mt-3" id="answerBtn">Ответить</button>

    <p class="mt-2">⏳ Час: <span id="timer"></span> с</p>

    {% if room.host == user %}
    <button class="btn btn-warning mt-2" id="forceBtn">
        ➡ Следующий вопрос (хост)
    </button>
    {% endif %}
</div>

<div id="results" style="display:none;"></div>

<script>
const roomCode = "{{ room.code }}";
const playerId = {{ player.id }};

let answered = false;
let currentQuestionId = null;
let timerInterval = null;


const socket = new WebSocket(
    (location.protocol === "https:" ? "wss" : "ws") +
    "://" + location.host +
    "/ws/room/" + roomCode + "/?play=1"
);

socket.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.event === "question") showQuestion(data);
    if (data.event === "finish") showResults(data.results);
};

function showQuestion(data) {
    answered = false;
    currentQuestionId = data.id;

    document.getElementById("question-block").style.display = "block";
    document.getElementById("results").style.display = "none";
    document.getElementById("question-text").innerText = data.text;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    data.answers.forEach(a => {
        answersDiv.innerHTML += `
            <div>
                <input type="checkbox" value="${a.id}" class="answer">
                ${a.text}
            </div>
        `;
    });

    document.getElementById("answerBtn").disabled = false;
    startTimer(data.time);
}

document.getElementById("answerBtn").onclick = () => {
    if (answered) return;
    answered = true;

    document.getElementById("answerBtn").disabled = true;

    const selected = [...document.querySelectorAll(".answer:checked")]
        .map(x => parseInt(x.value));

    socket.send(JSON.stringify({
        action: "answer",
        player_id: playerId,
        question_id: currentQuestionId,
        answers: selected
    }));

    document.getElementById("answers").innerHTML +=
        "<p>⏳ Ждём других игроков...</p>";
};

{% if room.host == user %}
document.getElementById("forceBtn").onclick = () => {
    socket.send(JSON.stringify({ action: "force_next" }));
};
{% endif %}

function startTimer(seconds) {
  clearInterval(timerInterval);
  const timer = document.getElementById("timer");
  timer.innerText = seconds;

  timerInterval = setInterval(() => {
    seconds--;
    timer.innerText = seconds;

    if (seconds <= 0) {
      clearInterval(timerInterval);
      document.getElementById("answerBtn").disabled = true;
    }
  }, 1000);
}
function showResults(results) {
    const box = document.getElementById("results");
    box.innerHTML = "<h3>Результаты</h3><ul>";

    results.forEach(r => {
        box.innerHTML += `<li>${r.user__username} — ${r.score}</li>`;
    });

    box.innerHTML += "</ul>";
    box.style.display = "block";
    document.getElementById("question-block").style.display = "none";
}
</script>
{% endblock %}
