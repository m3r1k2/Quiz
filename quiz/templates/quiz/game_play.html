{% extends "main.html" %}
{% block title %}Онлайн-вікторина{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card quiz-card p-4 text-center">
      <h2 class="fw-bold mb-3">🎮 Онлайн‑вікторина</h2>

      <div id="question-block" style="display:none;">
        <h4 id="question-text" class="mb-4"></h4>

        <div id="answers" class="d-grid gap-2 mb-3"></div>

        <p class="text-muted">
          ⏳ Час: <span id="timer"></span> c
        </p>

        <button class="btn btn-main w-100 mb-2" id="answerBtn">
          ✅ Відповісти
        </button>

        {% if room.host == user %}
        <button class="btn btn-outline w-100" id="forceBtn">
          ➡ Наступне питання (хост)
        </button>
        {% endif %}
      </div>
    </div>
  </div>
</div>

<script>
const roomCode = "{{ room.code }}";
const playerId = {{ player.id }};
const resultUrl = "{% url 'quiz:room_result' room.code %}";

let answered = false;
let currentQuestionId = null;
let timerInterval = null;

const socket = new WebSocket(
  (location.protocol === "https:" ? "wss" : "ws")
  + "://" + location.host
  + "/ws/room/" + roomCode + "/?play=1"
);

socket.onmessage = (e) => {
  const data = JSON.parse(e.data);
  if (data.event === "question") showQuestion(data);
  if (data.event === "finish") window.location.href = resultUrl;
};

function showQuestion(data) {
  answered = false;
  currentQuestionId = data.id;

  document.getElementById("question-block").style.display = "block";
  document.getElementById("question-text").innerText = data.text;

  const answers = document.getElementById("answers");
  answers.innerHTML = "";

  data.answers.forEach(a => {
    answers.innerHTML += `
      <label class="border rounded p-3 text-start">
        <input type="checkbox" class="answer me-2" value="${a.id}">
        ${a.text}
      </label>`;
  });

  document.getElementById("answerBtn").disabled = false;
  startTimer(data.time);
}

document.getElementById("answerBtn").onclick = () => {
  if (answered) return;
  answered = true;

  const selected = [...document.querySelectorAll(".answer:checked")]
    .map(x => parseInt(x.value));

  socket.send(JSON.stringify({
    action: "answer",
    player_id: playerId,
    question_id: currentQuestionId,
    answers: selected
  }));

  document.getElementById("answerBtn").disabled = true;
};

{% if room.host == user %}
document.getElementById("forceBtn").onclick = () => {
  socket.send(JSON.stringify({ action: "force_next" }));
};
{% endif %}

function startTimer(seconds) {
  clearInterval(timerInterval);
  const timer = document.getElementById("timer");
  timer.innerText = seconds;

  timerInterval = setInterval(() => {
    seconds--;
    timer.innerText = seconds;
    if (seconds <= 0) clearInterval(timerInterval);
  }, 1000);
}
</script>
{% endblock %}
