{% extends "main.html" %}

{% block content %}
<h1>QUIZ PAGE LOADED</h1>

<h2>Онлайн-вікторина</h2>

<div id="question-block" style="display:none;">
    <h3 id="question-text"></h3>

    <div id="media-block" class="my-3"></div>

    <div id="answers"></div>

    <p>⏳ Час: <span id="timer"></span> с</p>
</div>

<div id="results" style="display:none;"></div>

<script>
const roomCode = "{{ room.code }}";
const playerId = {{ player.id }};

const socket = new WebSocket(
    "ws://" + window.location.host + "/ws/room/" + roomCode + "/"
);

let timerInterval = null;

// ================== SOCKET ==================

socket.onmessage = function(e) {
    const data = JSON.parse(e.data);

    if (data.event === "question") {
        showQuestion(data);
    }

    if (data.event === "finish") {
        showResults(data.results);
    }
};

// ================== QUESTION ==================

function showQuestion(data) {
    document.getElementById("results").style.display = "none";
    document.getElementById("question-block").style.display = "block";

    document.getElementById("question-text").innerText = data.text;

    // media
    const media = document.getElementById("media-block");
    media.innerHTML = "";

    if (data.type === "image" && data.file_url) {
        media.innerHTML = `<img src="${data.file_url}" class="img-fluid rounded">`;
    }

    if (data.type === "video" && data.file_url) {
        media.innerHTML = `
            <video controls class="w-100 rounded">
                <source src="${data.file_url}">
            </video>
        `;
    }

    // answers
    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    data.answers.forEach(a => {
        answersDiv.innerHTML += `
            <button class="btn btn-outline-primary d-block mb-2"
                    onclick="sendAnswer(${data.id}, ${a.id})">
                ${a.text}
            </button>
        `;
    });

    startTimer(data.time);
}

// ================== ANSWER ==================

function sendAnswer(questionId, answerId) {
    socket.send(JSON.stringify({
        action: "answer",
        player_id: playerId,
        question_id: questionId,
        answer_id: answerId
    }));
}

// ================== TIMER ==================

function startTimer(seconds) {
    clearInterval(timerInterval);

    const timer = document.getElementById("timer");
    timer.innerText = seconds;

    timerInterval = setInterval(() => {
        seconds--;
        timer.innerText = seconds;

        if (seconds <= 0) {
            clearInterval(timerInterval);
        }
    }, 1000);
}

// ================== RESULTS ==================

function showResults(results) {
    const box = document.getElementById("results");
    box.innerHTML = "<h3>Результати</h3><ul>";

    results.forEach(r => {
        box.innerHTML += `<li>${r.user__username} — ${r.score}</li>`;
    });

    box.innerHTML += "</ul>";
    box.style.display = "block";
    document.getElementById("question-block").style.display = "none";
}
</script>
{% endblock %}
