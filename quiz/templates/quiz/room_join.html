{% extends "main.html" %}
{% block title %}Приєднатися до кімнати{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 shadow-lg rounded-4 text-center">

      <h3 class="mb-2">Приєднання до кімнати</h3>
      <p class="text-muted mb-4">
        Введіть код, який надав хост
      </p>

      <form method="post">
        {% csrf_token %}

        <input class="form-control form-control-lg text-center mb-3"
               type="text"
               name="code"
               placeholder="Код кімнати"
               required>

        <button class="btn btn-winter w-100 btn-glow">
          Увійти
        </button>
      </form>

      <small class="text-muted d-block mt-3">
        Код складається з літер або цифр
      </small>

    </div>
  </div>
</div>
{% endblock %}
